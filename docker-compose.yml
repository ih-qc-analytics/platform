services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: ihqc_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: testpassword
    ports:
      - "3307:3306"
    volumes:
      - ./backend/tests/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata: